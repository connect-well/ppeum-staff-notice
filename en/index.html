<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Service Staff Protection Notice | PPEUM GLOBAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
  <main class="notice">
    <header class="notice__head">
      <h1 class="notice__title">Customer Service Staff Protection Notice</h1>
    </header>
    <section class="notice__body">
      <p class="notice__text">
        Our staff are entitled to a safe working environment and<br class="soft">
        protection from verbal or physical abuse.<br>
        We kindly ask for your cooperation in maintaining a safe and<br class="soft">
        respectful environment based on mutual respect.
      </p>
    </section>
    <footer class="notice__foot">
      <img class="logo" src="/images/logo.png" alt="PPEUM GLOBAL" width="116" height="65">
    </footer>
  </main>
  <div class="poster">
    <img src="/images/en.jpg" alt="Customer Service Staff Protection Notice" width="1066" height="613">
  </div>
</body>
</html>
